services:
  postgres:
    image: postgres:16
    container_name: mm-postgres
    environment:
      POSTGRES_DB: mondaymemory
      POSTGRES_USER: monday
      POSTGRES_PASSWORD: monday
    ports:
      - "5432:5432"
    volumes:
      - mm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monday -d mondaymemory"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  redis:
    image: redis:7
    container_name: mm-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
volumes:
  mm_pgdata:
  redis-data:
