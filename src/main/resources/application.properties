spring.application.name=monday-backend
spring.profiles.active=${APP_ENV}
server.port=8443

# ===============================
# = Spring Security (Optional) =
# ===============================

# Enable stateless JWT auth (if using)
#spring.security.oauth2.resourceserver.jwt.issuer-uri=https://your-issuer.com/

jwt.secret=${JWT_SECRET}
jwt.expiration=3600000

app.security.devBypass=${DEV_BYPASS:true}
app.security.jwt.enabled=${JWT_ENABLED:false}

#jwt | opaque | dev
# jwt provides ISSUER/AUDIENCE/JWKSURI via env
app.security.mode=jwt
app.security.jwksUri=https://auth.monday/.well-known/jwks.json
app.security.issuer=https://auth.monday
app.security.audience=guest-audience

# ===============================
# = Actuator                    =
# ===============================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.group.readiness.include=db
#db, redis
management.endpoint.health.group.liveness.include=ping

# Note: This is optional
management.server.port=9001

# ===============================
# = CircuitBreaker              =
# ===============================

# Note: mondayTokenizationClient is a client that must be built out


# Trips open when recent failures exceed a threshold.
resilience4j.circuitbreaker.instances.mondayTokenizationClient.slidingWindowType=COUNT_BASED
# Retrieves the last X number of calls
resilience4j.circuitbreaker.instances.mondayTokenizationClient.slidingWindowSize=50
# % Failures to Trip
resilience4j.circuitbreaker.instances.mondayTokenizationClient.failureRateThreshold=50
# Stays open before half-open
resilience4j.circuitbreaker.instances.mondayTokenizationClient.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.mondayTokenizationClient.permittedNumberOfCallsInHalfOpenState=5

# Caps call latency (e.g., 300-800ms) so you fail fast.
resilience4j.timelimiter.instances.mondayTokenizationClient.timeoutDuration=500ms

# Caps concurrent calls so one slow dep can't eat all threads
resilience4j.bulkhead.instances.mondayTokenizationClient.maxConcurrentCalls=20
resilience4j.bulkhead.instances.mondayTokenizationClient.maxWaitDuration=0

# ===============================
# = Database Configuration      =
# ===============================

# Database connection settings
spring.datasource.url=${DB_URL:jdbc:h2:mem:testdb}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER_CLASS:org.h2.Driver}

# Hibernate (JPA) properties
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.database-platform=${DB_PLATFORM}
spring.h2.console.enabled=true

# ===============================
# = Redis Configuration      =
# ===============================

spring.redis.host=localhost
spring.redis.port=6379

# ===============================
# = Scheduled Tasks             =
# ===============================

spring.task.scheduling.pool.size=10
spring.task.scheduling.thread-name-prefix=scheduled-task-

# ===============================
# = Elasticsearch repos         =
# ===============================
spring.data.elasticsearch.repositories.enabled=false

# ===============================
# = Logging                     =
# ===============================

logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
# Logging level
logging.level.root=INFO
logging.level.com.monday.monday_backend=DEBUG

# ===============================
# = Billing                     =
# ===============================
billing.stripe.secretKey=${STRIPE_SECRET_KEY}
billing.stripe.webhookSecret=${STRIPE_WEBHOOK_SECRET}
billing.stripe.priceIdMonthly=${PRICE_ID_MONTHLY}
billing.stripe.priceIdAnnually=${PRICE_ID_ANNUAL}