spring.application.name=monday-backend
spring.profiles.active=${APP_ENV}
server.port=8443

org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# ===============================
# = Spring Security (Optional) =
# ===============================

# Enable stateless JWT auth (if using)
#spring.security.oauth2.resourceserver.jwt.issuer-uri=https://your-issuer.com/

jwt.secret=${JWT_SECRET}
jwt.expiration=3600000

app.security.devBypass=${DEV_BYPASS:true}
app.security.jwt.enabled=${JWT_ENABLED:false}

#jwt | opaque | dev
# jwt provides ISSUER/AUDIENCE/JWKSURI via env
app.security.mode=jwt
app.security.jwksUri=https://auth.monday/.well-known/jwks.json
app.security.issuer=https://auth.monday
app.security.audience=guest-audience

# ===============================
# = HTTPS                       =
# ===============================
server.ssl.enabled=true
server.ssl.key-store=classpath:ssl/${SSL_KEY_STORE}
server.ssl.key-store-password=${SSL_PASSWORD}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=${SSL_ALIAS}

# ===============================
# = Analytics                   =
# ===============================
internal.analytics.secret=${INTERNAL_ANALYTICS_SECRET}

# ===============================
# = Actuator                    =
# ===============================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.redis.enabled=false
management.health.elasticsearch.enabled=false
#management.endpoint.health.group.readiness.include=db, redis
management.endpoint.health.group.liveness.include=ping

# Note: This is optional
management.server.port=8443

# ===============================
# = CircuitBreaker              =
# ===============================

# Note: mondayTokenizationClient is a client that must be built out


# Trips open when recent failures exceed a threshold.
resilience4j.circuitbreaker.instances.mondayTokenizationClient.slidingWindowType=COUNT_BASED
# Retrieves the last X number of calls
resilience4j.circuitbreaker.instances.mondayTokenizationClient.slidingWindowSize=50
# % Failures to Trip
resilience4j.circuitbreaker.instances.mondayTokenizationClient.failureRateThreshold=50
# Stays open before half-open
resilience4j.circuitbreaker.instances.mondayTokenizationClient.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.mondayTokenizationClient.permittedNumberOfCallsInHalfOpenState=5

# Caps call latency (e.g., 300-800ms) so you fail fast.
resilience4j.timelimiter.instances.mondayTokenizationClient.timeoutDuration=500ms

# Caps concurrent calls so one slow dep can't eat all threads
resilience4j.bulkhead.instances.mondayTokenizationClient.maxConcurrentCalls=20
resilience4j.bulkhead.instances.mondayTokenizationClient.maxWaitDuration=0

# ===============================
# = Database Configuration      =
# ===============================

# Database connection settings
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mondaymemory}
spring.datasource.username=${DB_USER:monday}
spring.datasource.password=${DB_PASSWORD:monday}
spring.datasource.driver-class-name=${DB_DRIVER_CLASS:org.postgresql.Driver}

# Hibernate (JPA) properties
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.database-platform=${DB_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}
spring.h2.console.enabled=true

# ===============================
# = Flyway Configuration        =
# ===============================

# This treats the current schema as baseline; don't try to apply V1 as if this was an empty db
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true


# ===============================
# = Redis Configuration      =
# ===============================

spring.redis.host=localhost
spring.redis.port=6379

# ===============================
# = Scheduled Tasks             =
# ===============================

spring.task.scheduling.pool.size=10
spring.task.scheduling.thread-name-prefix=scheduled-task-

# ===============================
# = Elasticsearch repos         =
# ===============================
spring.data.elasticsearch.repositories.enabled=false

# ===============================
# = Logging                     =
# ===============================

logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
# Logging level
logging.level.root=INFO
logging.level.com.monday.monday_backend=DEBUG

# ===============================
# = Open AI                     =
# ===============================
openai.base-url=https://api.openai.com
openai.api-key=${OPENAI_API_KEY}
openai.org-id=${OPENAI_ORGANIZATION_ID}
openai.project-id=${OPENAI_PROJECT_ID}
openai.webhook-secret=${OPENAI_WEBHOOK_SECRET}
openai.default-model=gpt-5.1

# ===============================
# = LLM Presets                =
# ===============================
llm.provider=${LLM_MODEL_REQUESTED:openai}
llm.provider.default=${LLM_MODEL_DEFAULT:openai}
llm.model.timeout=${LLM_MODEL_TIMEOUT:20}

# ===============================
# = Billing                     =
# ===============================
billing.stripe.secretKey=${STRIPE_SECRET_KEY}
billing.stripe.webhookSecret=${STRIPE_WEBHOOK_SECRET}
billing.stripe.priceIdMonthly=${PRICE_ID_MONTHLY}
billing.stripe.priceIdAnnually=${PRICE_ID_ANNUAL}