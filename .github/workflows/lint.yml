name: Lint & Static Checks (backend)

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]

permissions:
  contents: read

concurrency:
  group: backend-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gradle-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: gradle/actions/wrapper-validation@v3
      - run: ./gradlew spotlessCheck checkstyleMain checkstyleTest -x test --no-daemon
