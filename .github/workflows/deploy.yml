name: Build & Deploy (backend)
on:
  push:
    branches: [ master ]
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/monday-backend

concurrency:
  group: backend-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      is_prod: ${{ steps.o.outputs.is_prod }}
      tag: ${{ steps.o.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: o
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "is_prod=true"  >> $GITHUB_OUTPUT
            echo "tag=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          else
            echo "is_prod=false" >> $GITHUB_OUTPUT
            echo "tag=staging-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          fi

  build_push:
    needs: meta
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Gradle wrapper validation (retry)
        uses: Wandalen/wretry.action@v1.4.8
        with:
          action: gradle/actions/wrapper-validation@v3
          attempt_limit: 3
          attempt_delay: 10s
          continue-on-error: true

      - name: Login GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pass execution command to gradle
        run: chmod +x gradlew

      - name: Assemble (skip tests for speed)
        run: ./gradlew clean assemble -x test --no-daemon

      - name: Jib push
        run: |
          TAGS="${{ needs.meta.outputs.tag }}"
          if [[ "${{ needs.meta.outputs.is_prod }}" == "true" ]]; then TAGS="$TAGS,latest"; fi
          ./gradlew jib -Djib.to.image=${{ env.IMAGE }} -Djib.to.tags=$TAGS --no-daemon

  deploy_env:
    needs: [meta, build_push, ]
    runs-on: ubuntu-latest
    environment: ${{ needs.meta.outputs.is_prod == 'true' && 'production' || 'staging' }}
    steps:
      - run: echo "Deploy backend tag -> ${{ needs.meta.outputs.tag }} (hook your platform CLI/Helm here)"
